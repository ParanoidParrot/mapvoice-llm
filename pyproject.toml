[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapvoice-llm"
version = "0.9.0"
description = "Bengaluru-Kannada geographic language adaptation experiments for MapVoice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116,<2",
    "pydantic>=2.11,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
